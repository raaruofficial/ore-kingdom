# Ore Kingdom — native client CI (android/): build-debug on pushes that touch
# the native client. This is the repo-root wiring of the workflow the client
# carries in its own tree (android/ was placed 2026-11-02; GitHub only reads
# workflows from the repo root, and the existing android.yml builds the root
# WebView shell project, so the native client gets its own workflow file).
# Debug only — release signing waits on the v0.1.3 signer-lineage question
# (NATIVE_CLIENT_CENSUS §4.4); no keystore is wired anywhere.

name: Android (native client)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build native debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK check (runner image ships the Android SDK)
        run: ls "$ANDROID_HOME/platforms" && ls "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ore-kingdom-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
