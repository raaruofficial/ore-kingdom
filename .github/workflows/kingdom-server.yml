name: Kingdom local backend

on:
  push:
    paths:
      - "server/**"
  pull_request:
    paths:
      - "server/**"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Contract surface tests
        working-directory: server/kingdom
        run: node test.mjs
