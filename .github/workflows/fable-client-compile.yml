# Ore Kingdom — Fable client compile check (android/fable-client/).
# Branch-scoped by design: GitHub only dispatches workflow_dispatch for
# workflows on the default branch, and this module does not touch main —
# so the run fires on pushes to the fable-client-compile branch itself
# (paths-scoped to the module). One deliberate run per push, no PR
# triggers, no tests, no APK, no signing. Compile-only verdict for the
# Fable-built client module (owner-elected CI route, 2026-11-26).
#
# Session 9 (Sonnet package, 2026-11-26): the same run now also proves
# the JVM unit tests and Android lint for :fable-client — one combined
# run per push (compile -> test -> lint), per the CI-economy rule.
#
# Integration run (2026-11-26, stage 1): the same combined run now also
# builds :app (which depends on :fable-client) and runs its JVM unit
# tests, so the host wiring is proven in the same single run per push.

name: Fable client compile

on:
  push:
    branches: [fable-client-compile]
    paths:
      - 'android/fable-client/**'
      - 'android/app/**'
      - 'android/settings.gradle.kts'
      - 'android/build.gradle.kts'
      - '.github/workflows/fable-client-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile + test + lint :fable-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile fable-client Kotlin
        run: gradle :fable-client:compileDebugKotlin --stacktrace

      - name: Unit tests (session 9)
        run: gradle :fable-client:testDebugUnitTest --stacktrace

      - name: Test report summary
        if: always()
        run: |
          for f in fable-client/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || true
          done

      - name: Lint fable-client
        if: always()
        continue-on-error: true
        run: gradle :fable-client:lintDebug --stacktrace

      - name: Lint report (text)
        if: always()
        run: |
          cat fable-client/build/reports/lint-results-debug.txt || echo "no lint text report produced"

      - name: Build :app debug APK (integration stage 1)
        run: gradle :app:assembleDebug --stacktrace

      - name: Unit tests :app (integration stage 1)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Test report summary :app
        if: always()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || true
          done
