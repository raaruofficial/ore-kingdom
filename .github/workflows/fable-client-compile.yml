# Ore Kingdom — Fable client compile check (android/fable-client/).
# Branch-scoped by design: GitHub only dispatches workflow_dispatch for
# workflows on the default branch, and this module does not touch main —
# so the run fires on pushes to the fable-client-compile branch itself
# (paths-scoped to the module). One deliberate run per push, no PR
# triggers, no tests, no APK, no signing. Compile-only verdict for the
# Fable-built client module (owner-elected CI route, 2026-11-26).

name: Fable client compile

on:
  push:
    branches: [fable-client-compile]
    paths:
      - 'android/fable-client/**'
      - 'android/settings.gradle.kts'
      - '.github/workflows/fable-client-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile :fable-client (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile fable-client Kotlin
        run: gradle :fable-client:compileDebugKotlin --stacktrace
