# Ore Kingdom — Fable client compile check (android/fable-client/).
# Dispatch-only by design: exactly one deliberate run per dispatch, no
# push/PR triggers, no tests, no APK, no signing. Compile-only verdict
# for the Fable-built client module (owner-elected CI route, 2026-11-26).

name: Fable client compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile :fable-client (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile fable-client Kotlin
        run: gradle :fable-client:compileDebugKotlin --stacktrace
