# Ore Kingdom — native client M4 gate, runtime leg: CI emulator cold-runs.
#
# A SEPARATE workflow from android-native.yml on purpose: the build gate
# stays a fast, high-signal check, while this gate is slower and depends
# on emulator infrastructure (KVM, system images). A flake here must
# never muddy the build signal — and a green build must never be read
# as runtime proof. This workflow is the runtime proof: cold start of
# the debug APK on an emulator, three variants (online / no-wallet /
# offline), each asserting process-alive, no-crash, and a rendered
# first screen (or, offline, the error + Retry state) from a real UI
# hierarchy dump.
#
# API level 35 (Android 15): the Seeker census of record
# (~/workspace/dapp-store-work/SEEKER_CENSUS_2026-10-29.md §8) — the
# Seeker shipped on Android 15 and the fleet spans Android 15→16
# (MR7+); 35 is the ship floor and this app's targetSdk. google_apis
# target (not playstore): adb root is available, which the offline
# variant's airplane-mode proof requires on API 35.

name: Android emulator cold-run (M4 gate)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-run:
    name: Emulator cold-runs (online / no-wallet / offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ore-kingdom-native-debug-apk-emulator-gate
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cold run — online
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: bash android/ci/emulator-cold-run.sh online "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/evidence/online"

      - name: Upload evidence — online
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-run-evidence-online
          path: evidence/online
          if-no-files-found: warn

      - name: Cold run — no-wallet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: bash android/ci/emulator-cold-run.sh nowallet "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/evidence/nowallet"

      - name: Upload evidence — no-wallet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-run-evidence-nowallet
          path: evidence/nowallet
          if-no-files-found: warn

      - name: Cold run — offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: bash android/ci/emulator-cold-run.sh offline "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/evidence/offline"

      - name: Upload evidence — offline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-run-evidence-offline
          path: evidence/offline
          if-no-files-found: warn
