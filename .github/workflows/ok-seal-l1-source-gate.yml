# DRAFT — NOT IN ANY REPO. Prepared 2026-11-21 for the December batch
# (see ../DECEMBER_BATCH_MANIFEST.md). Arm by copying into
# .github/workflows/ of raaruofficial/ore-kingdom at fire time, after
# FIRE_CHECKLIST.md is complete. Pin third-party actions by SHA at arm
# time. Dispatch-only: never a push tax (estate CI pattern).
#
# L1 = source-truth gate at the seal pin + JVM unit tests.
# Ports burst leg ok-gate-verify (ore-kingdom-seal-5usd.yaml) verbatim,
# plus the unit-test step from the repo's android-native.yml.

name: Ore Kingdom seal — L1 source gate + JVM tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: commit to gate (seal pin default)
        type: string
        default: 1a6207c3d3c169652b4e09f77489ea60580e4b6d

permissions:
  contents: read

env:
  SEAL_PIN: 1a6207c3d3c169652b4e09f77489ea60580e4b6d

jobs:
  source-gate:
    name: Source-truth gate + unit tests (pin)
    runs-on: ubuntu-latest # GitHub-hosted only
    timeout-minutes: 30
    steps:
      - name: Dispatch-source guard (R2-E1) — only the default branch's copy of this workflow may run
        run: |
          test "$GITHUB_REF" = "refs/heads/main" \
            || { echo "R2-E1 GUARD FAIL: dispatched from '$GITHUB_REF', not refs/heads/main. The pin assertion binds HEAD to a pin literal carried in the dispatched workflow file itself, so only the default branch's copy — whose pin is the pin of record — may certify a run; a foreign ref's copy pinning its own HEAD is refused here, before checkout."; exit 1; }
          echo "dispatch-source verified: $GITHUB_REF (pin of record = this branch's copy)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Pin check (B-M2) — HEAD must equal the seal pin
        run: |
          test "$(git rev-parse HEAD)" = "$SEAL_PIN" \
            || { echo "Ref is not the seal pin $SEAL_PIN — refusing to gate"; exit 1; }
          echo "pin-verified: HEAD=$(git rev-parse HEAD)"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: JDK evidence (feeds FIRE_CHECKLIST §C — CVE patch check)
        run: |
          java -version 2>&1 | tee jdk-version.txt
          echo "JAVA_HOME=$JAVA_HOME" >> jdk-version.txt

      - name: Source-truth gate (ported verbatim from ok-gate-verify)
        run: |
          { echo "ORE KINGDOM SEAL SOURCE GATE — pin $(git rev-parse HEAD) (asserted == seal pin $SEAL_PIN)";
          grep -q 'versionName = "0.1.4"' android/app/build.gradle.kts && echo 'PASS versionName 0.1.4' || echo 'FAIL versionName';
          grep -q 'versionCode = 5' android/app/build.gradle.kts && echo 'PASS versionCode 5' || echo 'FAIL versionCode';
          grep -q 'GradleException' android/app/build.gradle.kts && echo 'PASS B-4 release fail-closed throw present' || echo 'FAIL B-4 throw';
          grep -q 'orekingdom.137-184-143-128.sslip.io' android/app/build.gradle.kts && echo 'PASS HOST_URL default = production host' || echo 'FAIL HOST_URL default';
          grep -q 'OK_MEMBER_CAP ?? 1000' host/staging-v014/server.ts && echo 'PASS member cap 1000' || echo 'FAIL member cap';
          grep -q 'OK_JOIN_PRICE_SKR ?? 5000' host/staging-v014/server.ts && echo 'PASS join 5000 SKR once' || echo 'FAIL join price';
          grep -q 'OK_POST_PRICE_USD_CENTS_THREAD ?? 350' host/staging-v014/server.ts && echo 'PASS thread fee $3.50' || echo 'FAIL thread fee';
          grep -q 'POST_PRICE_REPLY_CENTS.*RETIRED' host/staging-v014/server.ts && echo 'PASS replies free (reply price RETIRED)' || echo 'FAIL replies';
          grep -q 'OK_PAID_PIN_CAP ?? 2' host/staging-v014/server.ts && echo 'PASS paid pin cap 2' || echo 'FAIL pin cap';
          grep -rq '$250 / 12h' android/app/src && echo 'PASS pin $250 / 12h (client)' || echo 'FAIL pin price';
          grep -q 'OK_COMMERCIAL_PRICE_CENTS ?? 5000' host/staging-v014/server.ts && echo 'PASS commercial $50' || echo 'FAIL commercial';
          grep -q 'OK_PRESTIGE_PRICE_SKR ?? 10000' host/staging-v014/server.ts && echo 'PASS prestige 10000 SKR' || echo 'FAIL prestige price';
          grep -q 'OK_PRESTIGE_CAP ?? 100' host/staging-v014/server.ts && echo 'PASS prestige cap 100' || echo 'FAIL prestige cap';
          grep -q 'OK_TIP_MIN_USD_CENTS ?? 500' host/staging-v014/server.ts && echo 'PASS tip min $5' || echo 'FAIL tip min';
          grep -q 'OK_TIP_MAX_USD_CENTS ?? 50000' host/staging-v014/server.ts && echo 'PASS tip max $500' || echo 'FAIL tip max';
          grep -q 'OK_TIP_FEE_USD_CENTS ?? 100' host/staging-v014/server.ts && echo 'PASS tip fee $1 flat' || echo 'FAIL tip fee';
          ! grep -rq 'FOUNDER_PRICE\|createFounderSession' android/app/src && echo 'PASS founder purchase apparatus absent from client' || echo 'FAIL founder apparatus present';
          } > verify-report.txt
          cat verify-report.txt
          ! grep -q '^FAIL' verify-report.txt

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.11.1"

      - name: JVM unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ok-seal-l1-evidence
          path: |
            verify-report.txt
            jdk-version.txt
            android/app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
