<!doctype html>
<html lang="en" class="ok-hold">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./assets/the-claim-icon-512-84x47j1h.png" type="image/png" />
    <title>Ore Kingdom</title>
    <style>
      /* T-WRAP pre-paint hold: candidate suppression containers stay hidden
         until the first classification pass completes (failsafe reveal at
         300 ms, timer in the script below). The suppression observer removes
         these nodes from the DOM outright; the hold only covers first paint. */
      html.ok-hold .prototype-banner,
      html.ok-hold section.subscription-panel,
      html.ok-hold .upgrade-panel,
      html.ok-hold div.owner-preview,
      html.ok-hold .launch-playbook,
      html.ok-hold .outreach-draft,
      html.ok-hold .treasury-guide,
      html.ok-hold .handoff-runbook,
      html.ok-hold section.build-guide,
      html.ok-hold section.terms-panel,
      html.ok-hold article.patron-tranche,
      html.ok-hold div.feed { display: none !important; }
      html.ok-hold section.gate-layout button { visibility: hidden; }

      /* T-WRAP injected blocks (sign-in sheet, cohort panel, Motherlode
         teaser). Styled to sit quietly inside the app's own surfaces. */
      .ok-signin-block { border-left: 3px solid #c9a227; padding: 0.6rem 0.9rem; margin: 0.8rem 0; font-size: 0.92rem; line-height: 1.45; }
      .ok-signin-block p { margin: 0.35rem 0; }
      .ok-signin-block .ok-disclosure { font-weight: 600; }
      .ok-signin-block .ok-about, .ok-signin-block .ok-footer-line { font-size: 0.85rem; opacity: 0.85; }
      .ok-cohort-panel { border: 1px solid #c9a227; border-radius: 10px; padding: 1rem 1.1rem; margin: 1rem 0; }
      .ok-cohort-panel h2 { margin: 0 0 0.5rem; font-size: 1.15rem; }
      .ok-cohort-panel p { margin: 0; line-height: 1.5; }
      .ok-motherlode-teaser { padding: 2rem 1.2rem; text-align: center; }
      .ok-motherlode-teaser h2 { margin: 0 0 0.6rem; font-size: 1.3rem; }
      .ok-motherlode-teaser p { margin: 0; line-height: 1.5; }

      /* T-WRAP boot error state (watchdog). */
      #ok-error { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #0b0e11; color: #f2f5f7; padding: 1.5rem; }
      #ok-error[hidden] { display: none; }
      #ok-error .ok-error-box { max-width: 26rem; text-align: center; }
      #ok-error h1 { font-size: 1.35rem; margin: 0 0 0.7rem; }
      #ok-error p { line-height: 1.5; margin: 0 0 1.2rem; opacity: 0.9; }
      #ok-error button { background: #c9a227; color: #131313; border: 0; border-radius: 8px; padding: 0.7rem 1.6rem; font-size: 1rem; font-weight: 700; cursor: pointer; }
      @media (prefers-color-scheme: light) { #ok-error { background: #f4f1ea; color: #1c1a15; } }
    </style>
    <script>
      /* Ore Kingdom T-WRAP — additive wrapper around the untouched bundle
         (PLAN_ARCHITECT §1 T-WRAP). Loaded synchronously BEFORE the bundle.
         It never edits bundle bytes: it (i) runs a boot watchdog with a
         full-screen error + Retry state, (ii) suppresses ruled surfaces
         from the DOM as they render (anchors from ANCHOR_TABLE.md,
         Phase 0), (iii) injects the sign-in disclosure/contact block and
         the #501 cohort panel, (iv) cures the Motherlode loading park
         with the ruled teaser. */
      (function () {
        "use strict";
        // Failsafe reveal first, before anything that could throw.
        setTimeout(function () { document.documentElement.classList.remove("ok-hold"); }, 300);
        try {
          var BOOT_MS = 8000, PARK_MS = 5000;

          /* ---------- (ii) suppression ---------- */
          var REMOVE_SELECTORS = [
            ".prototype-banner",               // census 1 — banner strip (SUPPRESS)
            "section.subscription-panel",      // census 5 — subscription panel
            ".upgrade-panel",                  // census 5 — Motherlode checkout upsell panel
            "div.owner-preview",               // census 4 — Owner Console entry
            ".launch-playbook", ".outreach-draft", ".treasury-guide", ".handoff-runbook", // census 4 — console interior
            "section.build-guide",             // census 4 — production handoff guide
            "section.terms-panel",             // draft Terms panel — SUPPRESS (final Terms live in kit/Pages)
            "article.patron-tranche"           // Ruling 3 — paid tranche card severs at its class anchor
          ];
          var DEMO_BUTTON_TEXTS = ["Open simulated Seeker", "Try founding claim simulation"]; // census 2

          function kill(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }

          function sweep() {
            var i, j, nodes;
            // Safety feed: remove the feed element and its "Moderation feed"
            // section header; the policy explainer grid stays (surface table).
            nodes = document.querySelectorAll("div.feed");
            for (i = 0; i < nodes.length; i++) {
              var sec = nodes[i].closest ? nodes[i].closest("section") : null;
              if (sec) {
                var hdrs = sec.querySelectorAll("header.section-header");
                for (j = 0; j < hdrs.length; j++) {
                  var h1 = hdrs[j].querySelector("h1");
                  if (h1 && h1.textContent.trim() === "Moderation feed") kill(hdrs[j]);
                }
              }
              kill(nodes[i]);
            }
            for (i = 0; i < REMOVE_SELECTORS.length; i++) {
              nodes = document.querySelectorAll(REMOVE_SELECTORS[i]);
              for (j = 0; j < nodes.length; j++) kill(nodes[j]);
            }
            // Demo gate buttons (text-anchored, inside the gate only).
            var gates = document.querySelectorAll("section.gate-layout");
            for (i = 0; i < gates.length; i++) {
              var btns = gates[i].querySelectorAll("button");
              for (j = 0; j < btns.length; j++) {
                if (DEMO_BUTTON_TEXTS.indexOf(btns[j].textContent.trim()) !== -1) kill(btns[j]);
              }
            }
            injectSigninBlocks();
            injectCohortPanel();
          }

          /* ---------- (iii) injections ---------- */
          function el(tag, cls, text) {
            var n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text != null) n.textContent = text;
            return n;
          }
          function buildSigninBlock() {
            var box = el("div", "ok-signin-block");
            box.setAttribute("data-ok-signin", "");
            box.appendChild(el("p", "ok-signin-lead", "Sign in with your wallet to post."));
            box.appendChild(el("p", "ok-disclosure", "Your forum name is your wallet. Everything you do here is permanently linkable to your on-chain finances."));
            box.appendChild(el("p", "ok-reading", "Reading is free and needs no wallet."));
            box.appendChild(el("p", "ok-about", "Ore Kingdom is run by Raaru, publisher of ORE data tools — see the publisher page via the forum's trusted links. An independent community forum; not affiliated with the ORE protocol or Regolith Labs."));
            var links = el("p", "ok-links");
            var a1 = el("a", null, "Publisher page"); a1.href = "https://raaruofficial.github.io/ore-kingdom/";
            var a2 = el("a", null, "Privacy policy"); a2.href = "https://raaruofficial.github.io/ore-kingdom/privacy.html";
            links.appendChild(a1); links.appendChild(document.createTextNode(" · ")); links.appendChild(a2);
            box.appendChild(links);
            box.appendChild(el("p", "ok-footer-line", "Ore Kingdom is an independent community forum. It is not affiliated with the ORE protocol or Regolith Labs."));
            return box;
          }
          function injectInto(section) {
            if (!section || section.hasAttribute("data-ok-injected")) return;
            if (section.querySelector("[data-ok-signin]")) { section.setAttribute("data-ok-injected", ""); return; }
            var firstBtn = section.querySelector("button");
            var block = buildSigninBlock();
            if (firstBtn && firstBtn.parentNode) firstBtn.parentNode.insertBefore(block, firstBtn);
            else section.appendChild(block);
            section.setAttribute("data-ok-injected", "");
          }
          function injectSigninBlocks() {
            var secs = document.querySelectorAll("section.skr-gate, section.gate-layout");
            for (var i = 0; i < secs.length; i++) injectInto(secs[i]);
          }
          function injectCohortPanel() {
            if (document.querySelector("[data-ok-cohort]")) return;
            var spans = document.querySelectorAll("span.sold-out");
            for (var i = 0; i < spans.length; i++) {
              if (spans[i].textContent.trim() === "Free tranche claimed") {
                var panel = el("section", "ok-cohort-panel");
                panel.setAttribute("data-ok-cohort", "");
                panel.appendChild(el("h2", null, "The founding 500 are claimed."));
                panel.appendChild(el("p", null, "Every founding badge has been claimed. The forum is free and fully open — sign in with your wallet to post. Founding badges were a one-time mark for the first 500 members. There is no paid badge and no waitlist."));
                var anchor = spans[i].closest ? (spans[i].closest("section.founding-tranches") || spans[i].closest("article") || spans[i]) : spans[i];
                if (anchor.parentNode) anchor.parentNode.insertBefore(panel, anchor.nextSibling);
                return;
              }
            }
          }

          var sweepQueued = false;
          function queueSweep() {
            if (sweepQueued) return;
            sweepQueued = true;
            requestAnimationFrame(function () { sweepQueued = false; try { sweep(); } catch (e) {} });
          }
          var observer = new MutationObserver(queueSweep);
          observer.observe(document.documentElement, { childList: true, subtree: true });
          document.addEventListener("DOMContentLoaded", function () {
            try { sweep(); } catch (e) {}
            document.documentElement.classList.remove("ok-hold");
          });

          /* ---------- (iv) Motherlode park cure ---------- */
          var parkSince = 0;
          setInterval(function () {
            var loaders = document.querySelectorAll("div.loading");
            var park = null;
            for (var i = 0; i < loaders.length; i++) {
              if (loaders[i].textContent.trim() === "Following the vein…") { park = loaders[i]; break; }
            }
            var teaser = document.querySelector("[data-ok-teaser]");
            if (!park) {
              parkSince = 0;
              if (teaser) kill(teaser); // view resolved or left: retire the teaser
              return;
            }
            if (!parkSince) { parkSince = Date.now(); return; }
            if (Date.now() - parkSince >= PARK_MS && !teaser) {
              // Insert the ruled teaser AFTER the loading node and hide the
              // node (never replace it: the node is React-managed, and React
              // must be able to remove it itself when the query resolves).
              var t = el("section", "ok-motherlode-teaser");
              t.setAttribute("data-ok-teaser", "");
              t.appendChild(el("h2", null, "The Motherlode — founding members' room."));
              t.appendChild(el("p", null, "Open to the first 500 members, who claimed a free founding badge."));
              if (park.parentNode) {
                park.parentNode.insertBefore(t, park.nextSibling);
                park.style.display = "none";
              }
            }
          }, 500);

          /* ---------- (i) boot watchdog + error surface ---------- */
          var booted = false, errorShown = false;
          function showError() {
            if (errorShown) return;
            errorShown = true;
            var box = document.getElementById("ok-error");
            if (box) box.hidden = false;
          }
          window.__okBooted = function () { return booted; };
          var bootTick = setInterval(function () {
            // Any bundle-rendered root counts as booted: the forum
            // shell and the sign-in gate are both working app surfaces
            // (neither exists in the static markup).
            if (document.querySelector(".app-shell") || document.querySelector("section.gate-layout")) {
              booted = true;
              clearInterval(bootTick);
              // KFC-002 latch cure (2026-10-29): a late boot un-shows
              // a watchdog surface that fired while the bundle was
              // still mounting — the surface and its armed handlers
              // must never outlive the boot they were guarding.
              if (errorShown) {
                var errBox = document.getElementById("ok-error");
                if (errBox) errBox.hidden = true;
                errorShown = false;
              }
            }
          }, 400);
          // The deadline shows the surface for a dead bundle; the
          // poll deliberately outlives it so a late boot still
          // disarms (hard stop at 120 s bounds a truly dead page).
          setTimeout(function () { if (!booted) showError(); }, BOOT_MS);
          setTimeout(function () { clearInterval(bootTick); }, 120000);
          window.addEventListener("error", function (ev) {
            if (booted) return;
            // Script errors are fatal to the boot; resource errors (a font or
            // image 404) are not — the watchdog deadline covers a dead bundle.
            if (ev && (ev.error || (ev.target && ev.target.tagName === "SCRIPT"))) showError();
          }, true);
          window.addEventListener("unhandledrejection", function () { if (!booted) showError(); });
        } catch (e) {
          // The wrapper must never break the app it wraps.
          setTimeout(function () { document.documentElement.classList.remove("ok-hold"); }, 300);
        }
      })();
    </script>
    <link rel="stylesheet" crossorigin href="./assets/index-8rkygmfh.css" />
  </head>
  <body>
    <div
      data-generated-space-root=""
      data-generated-space-slug="ore-community-forum"
    ></div>
    <div id="ok-error" hidden role="alert">
      <div class="ok-error-box">
        <h1>Ore Kingdom could not load</h1>
        <p>The forum did not answer. Check your connection and try again.</p>
        <button type="button" onclick="window.location.reload()">Retry</button>
      </div>
    </div>
    <script type="module" crossorigin src="./assets/index-ztcgah8s.js"></script>
  </body>
</html>
